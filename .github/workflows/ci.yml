name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: JobNectoTest
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d JobNectoTest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBNECTO_TEST_POSTGRES: Host=localhost;Port=5432;Database=JobNectoTest;Username=test;Password=test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/JobNecto.slnx

      - name: Build
        run: dotnet build backend/JobNecto.slnx --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test backend/JobNecto.slnx --configuration Release --no-build --warnaserror