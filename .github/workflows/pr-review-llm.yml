name: PR review (LLM via OpenRouter)

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".cursor/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review (for example: 55 or #55)'
        required: true
        type: string
      model:
        description: Primary OpenRouter model (optional; fallbacks still apply)
        required: false
        type: string
        default: 'nvidia/nemotron-3-ultra-550b-a55b:free'

concurrency:
  group: pr-review-llm-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  llm-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.body || '', '[skip-review]'))
    runs-on: ubuntu-latest
    # Above OPENROUTER_TOTAL_BUDGET_MS (20 min) so retries/fallbacks can finish and still comment.
    timeout-minutes: 30
    steps:
      - name: Resolve PR metadata
        id: pr_meta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rawPrInput = context.eventName === "workflow_dispatch"
              ? String(context.payload.inputs?.pr_number ?? "").trim()
              : String(context.payload.pull_request?.number ?? "").trim();

            const normalizedPrInput = rawPrInput.replace(/^#/, "");
            const prNumber = Number(normalizedPrInput);

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(
                `Invalid PR number: "${rawPrInput}". Provide values like "55" or "#55".`
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput("number", String(pr.number));
            core.setOutput("title", pr.title ?? "");
            core.setOutput("body", pr.body ?? "");
            core.setOutput("draft", String(Boolean(pr.draft)));
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_repo", pr.head.repo.full_name);

            // On a `synchronize` push, `before` is the PR's head before this push. Diffing
            // from there (not the PR base) means an unchanged-since-last-review hunk is never
            // shown to the model again — it can't re-flag (or word differently and re-flag) a
            // finding on code it no longer sees, regardless of whether it reads the review
            // history correctly. `opened`/`reopened`/`ready_for_review`/workflow_dispatch have
            // no meaningful "since" point, so they still get the full base..head diff.
            const before = context.eventName === "pull_request" && context.payload.action === "synchronize"
              ? String(context.payload.before ?? "")
              : "";
            const isRealSha = /^[0-9a-f]{40}$/i.test(before) && !/^0+$/.test(before);
            core.setOutput("since_sha", isRealSha ? before : "");

      - name: Checkout PR head (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ steps.pr_meta.outputs.head_repo }}
          ref: ${{ steps.pr_meta.outputs.head_sha }}

      - name: Fetch base and since commits (supports forks)
        run: |
          set -e
          git fetch --no-tags "https://github.com/${{ github.repository }}.git" ${{ steps.pr_meta.outputs.base_sha }}
          since="${{ steps.pr_meta.outputs.since_sha }}"
          if [ -n "$since" ]; then
            if ! git fetch --no-tags "https://github.com/${{ github.repository }}.git" "$since"; then
              echo "::warning::Could not fetch since_sha=$since (likely pruned by a force-push/rebase) — will fall back to the full base diff."
            fi
          fi

      - name: Write unified diff
        run: |
          set -e
          base="${{ steps.pr_meta.outputs.base_sha }}"
          head="${{ steps.pr_meta.outputs.head_sha }}"
          since="${{ steps.pr_meta.outputs.since_sha }}"
          # Fall back to the full base diff if `since` is unusable: not fetched (pruned by a
          # force-push/rebase since the event fired) or not an ancestor of head (history rewritten).
          if [ -n "$since" ] && git cat-file -e "${since}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$since" "$head"; then
            echo "diff_mode=incremental" >> "$GITHUB_ENV"
            echo "Review mode: incremental (since=$since, head=$head)"
            git diff "$since" "$head" > pr.diff
          else
            echo "diff_mode=full" >> "$GITHUB_ENV"
            reason="no since_sha (first review)"
            [ -n "$since" ] && reason="since_sha=$since unusable (not fetched or not an ancestor of head)"
            echo "Review mode: full ($reason; base=$base, head=$head)"
            git diff "$base" "$head" > pr.diff
          fi
          wc -c pr.diff || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run OpenRouter review and comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr_meta.outputs.number }}
          DIFF_MODE: ${{ env.diff_mode }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model || vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          # Comma-separated models tried after the primary; free models discovered from the
          # live catalog and the `openrouter/free` router are appended automatically.
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS || '' }}
          OPENROUTER_MAX_RETRIES: "10"
        run: node .github/scripts/pr_review_llm.mjs pr.diff
