name: PR review (LLM via OpenRouter)

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".cursor/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      model:
        description: OpenRouter model to use (optional)
        required: false
        type: string
        default: 'nvidia/nemotron-3-super-120b-a12b:free'

concurrency:
  group: pr-review-llm-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  llm-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.body || '', '[skip-review]'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR metadata
        id: pr_meta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.eventName === "workflow_dispatch"
              ? Number(core.getInput("pr_number", { required: true }))
              : context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput("number", String(pr.number));
            core.setOutput("title", pr.title ?? "");
            core.setOutput("body", pr.body ?? "");
            core.setOutput("draft", String(Boolean(pr.draft)));
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_repo", pr.head.repo.full_name);

      - name: Checkout PR head (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ steps.pr_meta.outputs.head_repo }}
          ref: ${{ steps.pr_meta.outputs.head_sha }}

      - name: Fetch base commit (supports forks)
        run: >-
          git fetch --no-tags
          "https://github.com/${{ github.repository }}.git"
          ${{ steps.pr_meta.outputs.base_sha }}

      - name: Write unified diff
        run: |
          set -e
          git diff ${{ steps.pr_meta.outputs.base_sha }} ${{ steps.pr_meta.outputs.head_sha }} > pr.diff
          wc -c pr.diff || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run OpenRouter review and comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr_meta.outputs.number }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model || vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
        run: node .github/scripts/pr_review_llm.mjs pr.diff
