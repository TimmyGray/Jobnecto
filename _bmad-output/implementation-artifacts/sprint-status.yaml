# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog → in-progress: Automatically when first story is created (via create-story)
#   - in-progress → done: Manually when all stories reach 'done' status
#
# Story Status:
#   - backlog: Story not yet started
#   - ready-for-dev: Story has been drafted/prepared (story file exists)
#   - in-progress: Story is currently being developed
#   - review: Story is in code review
#   - done: Story is complete and merged
#
# Story Status Transitions:
#   - backlog → ready-for-dev: When story file is created (via create-story)
#   - ready-for-dev → in-progress: When dev starts (via dev-story)
#   - in-progress → review: When dev submits for review (via code-review)
#   - review → done: When review is approved and merged
#
# Retrospective Status:
#   - optional: Epic retrospective is available but not required
#   - done: Retrospective has been completed

