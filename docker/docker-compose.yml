services:
  archon:
    image: ghcr.io/coleam00/archon:latest
    container_name: archon-persist
    restart: unless-stopped
    ports:
      - "${ARCHON_HOST_PORT:-3093}:3090"
    env_file:
      - ./.env.archon
    environment:
      PORT: "3090"
      GH_TOKEN: ${GH_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CLAUDE_USE_GLOBAL_AUTH: ${CLAUDE_USE_GLOBAL_AUTH:-true}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - archon_data:/home/appuser/.archon
      - claude_auth:/home/appuser/.claude
    command: ["serve", "--port", "3090"]

volumes:
  archon_data:
  claude_auth:
