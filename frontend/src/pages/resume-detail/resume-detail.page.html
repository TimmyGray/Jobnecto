<ui-page-header eyebrow="Résumés">
  {{ heading() }}

  <a
    primaryAction
    routerLink="/resumes"
    class="inline-flex shrink-0 items-center rounded-md border border-border-default bg-surface px-4 py-2 text-md font-medium text-text-primary transition-colors duration-standard hover:bg-canvas focus-visible:outline focus-visible:outline-2 focus-visible:outline-border-focus"
    >Back to résumés</a
  >
</ui-page-header>

@switch (status()) {
  @case ('loading') {
    <div
      #loadingRegion
      data-testid="resume-skeleton"
      tabindex="-1"
      class="flex flex-col gap-4"
      role="status"
    >
      <span class="sr-only">Loading résumé…</span>
      <ui-skeleton [lines]="8" />
    </div>
  }
  @case ('ready') {
    <widget-resume-form
      [resume]="resume()"
      [submitting]="saving() || deleting()"
      (update)="onUpdate($event)"
    />

    <section class="mt-10 border-t border-border-default pt-6" aria-labelledby="danger-zone-heading">
      <h2 id="danger-zone-heading" class="text-md font-semibold text-text-primary">
        Delete this résumé
      </h2>
      <p class="mt-1 text-md text-text-secondary">
        Removes it from your résumés. This can't be undone from the app.
      </p>
      <button
        type="button"
        #deleteButton
        data-testid="delete-resume"
        [attr.aria-disabled]="saving()"
        class="mt-4 inline-flex items-center rounded-md border border-status-danger bg-surface px-4 py-2 text-md font-medium text-status-danger transition-colors duration-standard hover:bg-canvas focus-visible:outline focus-visible:outline-2 focus-visible:outline-border-focus aria-disabled:cursor-not-allowed aria-disabled:opacity-60"
        (click)="openDelete()"
      >
        Delete résumé
      </button>
    </section>
  }
  @case ('not-found') {
    <ui-not-found-state
      #recoveryRegion
      tabindex="-1"
      headline="Résumé not found"
      guidance="It may have been deleted, or the link may be wrong."
      backLabel="Back to résumés"
      (back)="goBack()"
    />
  }
  @case ('forbidden') {
    <ui-forbidden-state
      #recoveryRegion
      tabindex="-1"
      guidance="This résumé isn't available to you."
      recoverLabel="Back to résumés"
      (recover)="goBack()"
    />
  }
  @case ('error') {
    <ui-error-state
      headline="Couldn't load this résumé"
      detail="Check your connection and try again."
      (retry)="retry()"
    />
  }
}

<ui-confirm-dialog
  [open]="confirmingDelete()"
  headline="Delete this résumé?"
  message="It will be removed from your résumés. This can't be undone from the app."
  [confirmLabel]="deleting() ? 'Deleting…' : 'Delete résumé'"
  [destructive]="true"
  [busy]="deleting()"
  busyMessage="Deleting résumé…"
  [returnFocusTo]="deleteButton()?.nativeElement ?? null"
  (confirm)="onConfirmDelete()"
  (cancel)="cancelDelete()"
/>
