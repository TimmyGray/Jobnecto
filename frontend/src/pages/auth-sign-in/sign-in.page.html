<main class="min-h-screen flex items-center justify-center px-4 py-12">
  <section
    class="w-full max-w-md rounded-lg border border-border-default bg-surface p-8 shadow-md"
    aria-labelledby="sign-in-heading"
  >
    <p class="mb-2 font-mono text-xs uppercase tracking-wide text-text-muted">
      Welcome back
    </p>
    <h1 id="sign-in-heading" class="mb-1 text-xl font-semibold text-text-primary">
      Sign in to <span class="font-serif italic text-brand-accent">Jobnecto</span>
    </h1>
    <p class="mb-6 text-md text-text-secondary">
      Enter your credentials to get back into your account.
    </p>

    <!-- Wrong-credentials banner (401) — one generic message, never per-field. [AC4] -->
    @if (generalError()) {
      <div
        class="mb-4 rounded-md border border-status-danger px-4 py-3 text-sm text-status-danger"
        role="alert"
        aria-live="assertive"
      >
        {{ generalError() }}
      </div>
    }

    <!-- Rate-limited banner (429) — friendly, plain-language, never a raw code. [AC5, AC6] -->
    @if (rateLimitMessage()) {
      <div
        class="mb-4 rounded-md border border-status-warning bg-status-warning-bg px-4 py-3 text-sm text-text-primary"
        role="alert"
        aria-live="assertive"
      >
        {{ rateLimitMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="flex flex-col gap-4">
        <ui-text-field
          formControlName="identifier"
          label="Email or login name"
          name="identifier"
          autoComplete="username"
          [required]="true"
          [error]="errorFor('identifier')"
        />

        <ui-text-field
          formControlName="password"
          label="Password"
          name="password"
          type="password"
          autoComplete="current-password"
          [required]="true"
          [error]="errorFor('password')"
        />
      </div>

      <button
        type="submit"
        class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-md bg-action-primary px-4 py-3 text-md font-medium text-text-inverse transition-colors duration-standard hover:bg-action-primary-hover disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus"
        [disabled]="!canSubmit"
      >
        @if (submitting()) {
          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-text-inverse border-t-transparent"
            aria-hidden="true"
          ></span>
          <span>Signing in…</span>
        } @else {
          <span>Sign in</span>
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-text-secondary">
      Don't have an account?
      <a routerLink="/sign-up" class="font-medium text-brand-accent hover:underline">Sign up</a>
    </p>
  </section>
</main>
